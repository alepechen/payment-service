spring.application.name=payment-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---------- Resilience4j: retry ----------
resilience4j.retry.instances.provider.max-attempts=3
resilience4j.retry.instances.provider.wait-duration=200ms
resilience4j.retry.instances.provider.enable-exponential-backoff=true
resilience4j.retry.instances.provider.exponential-backoff-multiplier=2
# Exponential backoff + randomized wait = exponential backoff with jitter
resilience4j.retry.instances.provider.enable-randomized-wait=true
resilience4j.retry.instances.provider.randomized-wait-factor=0.5

# ---------- Resilience4j: circuit breaker ----------
resilience4j.circuitbreaker.instances.provider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.provider.sliding-window-size=20
resilience4j.circuitbreaker.instances.provider.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.provider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.provider.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.provider.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.provider.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.provider.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.provider.automatic-transition-from-open-to-half-open-enabled=true

# ---------- Resilience4j: bulkhead ----------
resilience4j.bulkhead.instances.provider.max-concurrent-calls=20
resilience4j.bulkhead.instances.provider.max-wait-duration=100ms

# ---------- Actuator & monitoring ----------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,retries
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
# Breaker state shows in /actuator/health but must not fail it (keeps the provider out of liveness)
management.health.circuitbreakers.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Histogram buckets so you can graph p95/p99 provider latency
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Trace everything locally; lower this in production
management.tracing.sampling.probability=1.0

# ---------- Logging ----------
logging.level.com.example.payments=DEBUG
logging.level.io.github.resilience4j=INFO
# JSON logs for production (hard to read locally, so enable per profile):
# logging.structured.format.console=ecs